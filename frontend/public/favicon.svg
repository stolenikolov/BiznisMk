<!-- BiznisMk tab mark.

     The app's primary treatment, at 16px: the accent cyan as the tile, the
     near-black canvas colour as the ink on top of it — the same pairing as a
     primary pill button. It carries the brand into a tab strip of either
     theme, which a bare white glyph cannot do.

     The B is drawn rather than set: a favicon renders without the page's
     webfonts, so Inter is not available here, and this traces its shape —
     a grotesque B with flattened bowl sides, stem and bowl walls both 7 of a
     36 cap height, horizontals a touch thinner, and the lower bowl wider and
     its counter taller than the upper one. Circular bowls read as a hard "8"
     once the tab shrinks them.

     Tile 64 with a 14 radius; cap height 36, so the letter keeps an even
     margin all round instead of filling the tile. Counters are holes via
     fill-rule, so the tile shows through them. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#19b9d6"/>
  <path fill="#0f1011" fill-rule="evenodd" d="
    M17 14 H33 C39.6 14 43.5 17.6 43.5 23 C43.5 26.4 42 28.9 39.4 30.2
      C43 31 46.5 34.2 46.5 39.6 C46.5 46 42.2 50 35 50 H17 Z
    M24 20 H32.6 C35.2 20 36.6 21.4 36.6 23.7 C36.6 26 35.2 27.5 32.6 27.5 H24 Z
    M24 34 H34 C36.9 34 38.6 35.9 38.6 39 C38.6 42.1 36.9 44 34 44 H24 Z
  "/>
</svg>
